name: Merged PR Main Releasability Dispatch

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: write

jobs:
  dispatch-main-releasability:
    name: Dispatch Main Releasability
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dispatch main releasability gate for every merged revision
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_COMMIT_SHA" ] || [ -z "$BASE_SHA" ] || [ -z "$COMMIT_COUNT" ]; then
            echo "::error::Merged PR SHA, base SHA, and commit count are required for per-revision dispatch"
            exit 1
          fi

          merge_methods="$(gh api "repos/$GITHUB_REPOSITORY" \
            --jq '[.allow_squash_merge, .allow_merge_commit, .allow_rebase_merge] | @csv')"
          if [ "$merge_methods" != "false,false,true" ]; then
            echo "::error::Merge methods changed ($merge_methods); per-revision dispatch assumes rebase-only merging."
            exit 1
          fi

          git fetch origin main --quiet
          git checkout --quiet --detach FETCH_HEAD
          if ! git merge-base --is-ancestor "$BASE_SHA" "$MERGE_COMMIT_SHA"; then
            echo "::error::Merged PR base $BASE_SHA is not an ancestor of merge SHA $MERGE_COMMIT_SHA"
            exit 1
          fi
          revisions="$(git rev-list --reverse "$BASE_SHA..$MERGE_COMMIT_SHA")"
          revision_count="$(printf '%s\n' "$revisions" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$revision_count" != "$COMMIT_COUNT" ]; then
            echo "::error::Merged range has $revision_count revision(s), expected pull-request count $COMMIT_COUNT; refusing a partial or over-broad dispatch."
            exit 1
          fi
          if [ -z "$revisions" ]; then
            echo "::error::No revisions enumerated for merged PR #$PR_NUMBER at $MERGE_COMMIT_SHA"
            exit 1
          fi

          for revision in $revisions; do
            if ! git merge-base --is-ancestor "$revision" HEAD; then
              echo "::error::Revision $revision is not an ancestor of fetched main; refusing to dispatch."
              exit 1
            fi
            dispatch_ref="main-releasability-${revision}"
            existing_ref_sha=""
            if existing_ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$dispatch_ref" --jq .object.sha 2>/dev/null)"; then
              if [ "$existing_ref_sha" != "$revision" ]; then
                echo "::error::Dispatch ref $dispatch_ref points to $existing_ref_sha, expected $revision"
                exit 1
              fi
            else
              existing_ref_sha=""
            fi
            if [ -z "$existing_ref_sha" ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$dispatch_ref" \
                -f sha="$revision" >/dev/null
            fi
            gh workflow run main-releasability.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$dispatch_ref" \
              -f expected_sha="$revision" \
              -f triggering_pr="$PR_NUMBER"
            echo "Dispatched main releasability for $revision (PR #$PR_NUMBER)"
          done
